; PlatformIO Project Configuration File
; OXY-LD2 - Analyseur O2 fixe - reecriture (voir ARCHITECTURE.md)
; Materiel repris d'OXY-LD - ESP32-S3-WROOM-1 (N16R2), voir HARDWARE.md

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino

board_build.flash_size = 16MB
board_build.psram_type = qspi
board_build.arduino.memory_type = qio_qspi

monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -Wall
    -Wextra
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit ADS1X15 @ ^2.5.0
    adafruit/RTClib @ ^2.1.4
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
    adafruit/Adafruit PN532 @ ^1.3.0
    adafruit/Adafruit NeoPixel @ ^1.12.0
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0

; Environnement natif (hote, pas de carte) pour les tests unitaires
; de la logique pure : calcul MOD, arrondi, compensation thermique...
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
